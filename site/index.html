<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翁祺鈞 Chi-Jiun Wong</title>
    <meta name="description" content="翁祺鈞的個人網站：中央大學資工系、輔修財金。研究聯邦學習裡差分隱私的零知識證明，興趣在區塊鏈、金融科技與軟體工程。" />
    <meta property="og:title" content="翁祺鈞 Chi-Jiun Wong" />
    <meta property="og:description" content="可驗證的隱私保護機器學習、區塊鏈與金融科技。" />
    <meta property="og:url" content="https://chijiun.github.io/" />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b10'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='16' font-weight='700' fill='%23ff8a65'%3ECJ%3C/text%3E%3C/svg%3E" />
    <script>
      try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主要內容</a>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="progress" aria-hidden="true"></div>

    <nav class="nav" aria-label="主選單">
      <a class="brand" href="#top">Chi-Jiun<span>.</span></a>
      <a class="sec" href="#research">研究</a>
      <a class="sec" href="#experience">經歷</a>
      <a class="sec" href="#projects">作品</a>
      <button id="open-pal" type="button" aria-label="開啟指令面板">Ctrl K</button>
      <button id="theme" type="button" aria-label="切換深色或淺色">◐</button>
    </nav>

    <main id="main">
      <header class="hero wrap" id="top">
        <div>
          <p class="tagline" id="tagline"></p>
          <h1 id="name"></h1>
          <p class="zh" id="zh"></p>
          <p class="intro" id="intro"></p>
          <p class="motto" id="motto"></p>
          <div class="links" id="links"></div>
        </div>
        <div class="deck">
          <div class="hud" id="hud" aria-live="polite"></div>
          <div class="kb-stage">
            <div class="kb" id="kb" role="group" aria-label="互動鍵盤：按實體鍵盤的字母鍵，或點鍵帽，看每項技能用在哪裡"></div>
          </div>
          <div class="deck-foot">
            <div class="legend" id="legend"></div>
            <button class="sound" id="sound" type="button" aria-pressed="false">按鍵音效：關</button>
          </div>
        </div>
      </header>

      <section class="section wrap" id="research">
        <div class="sh"><span class="no">01</span><h2>研究</h2></div>
        <div class="interests" id="interests"></div>
        <div id="studies"></div>
      </section>

      <section class="section wrap" id="experience">
        <div class="sh"><span class="no">02</span><h2>經歷</h2><span class="hint">點一下視窗，用 j / k 讀</span></div>
        <div class="win rise" id="win">
          <div class="titlebar">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="name" id="ed-title"></span>
          </div>
          <div class="tabs" id="tabs" role="tablist" aria-label="經歷檔案"></div>
          <div class="buf" id="buf" tabindex="0" role="tabpanel" aria-label="檔案內容"></div>
          <div class="edbar">
            <span class="mode">NORMAL</span>
            <span class="hint" id="ed-hint"></span>
            <span class="pos" id="ed-pos"></span>
          </div>
        </div>
      </section>

      <section class="section wrap" id="projects">
        <div class="sh"><span class="no">03</span><h2>作品</h2></div>
        <ul class="cards" id="cards"></ul>
        <p class="more-title">MORE</p>
        <ul class="more" id="more"></ul>
      </section>
    </main>

    <footer class="footer wrap">© 2026 翁祺鈞 Chi-Jiun Wong</footer>

    <div class="status" aria-hidden="true">
      <span class="mode" id="st-mode">NORMAL</span>
      <span class="file" id="st-file">about.md</span>
      <span class="msg" id="st-msg"></span>
      <span id="st-pos">0%</span>
    </div>

    <dialog id="pal" aria-label="指令面板">
      <div>
        <input id="q" type="text" placeholder="想去哪裡、想做什麼？也可以打 :theme、:e research" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="搜尋指令" />
        <ul id="list" role="listbox"></ul>
        <p class="foot">↑↓ 選擇 · Enter 執行 · Esc 關閉</p>
      </div>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
