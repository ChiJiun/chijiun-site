<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翁祺鈞 Chi-Jiun Wong</title>
    <meta name="description" content="翁祺鈞的個人網站：中央大學資工系、輔修財金。研究聯邦學習裡差分隱私的零知識證明，興趣在區塊鏈、金融科技與軟體工程。" />
    <meta property="og:title" content="翁祺鈞 Chi-Jiun Wong" />
    <meta property="og:description" content="可驗證的隱私保護機器學習、區塊鏈與金融科技。" />
    <meta property="og:url" content="https://chijiun.com/" />
    <meta name="theme-color" content="#0c0c0b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0c0b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-size='16' font-weight='700' fill='%23ffa028'%3ECJ%3C/text%3E%3C/svg%3E" />
    <script>
      try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    </script>
    <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css?v=fa4d8c20" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主要內容</a>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="progress" aria-hidden="true"></div>

    <nav class="nav" aria-label="主選單">
      <a class="brand" href="#top">Chi-Jiun<span>.</span></a>
      <a class="sec" href="#research">研究</a>
      <a class="sec" href="#experience">經歷</a>
      <a class="sec" href="#projects">作品</a>
      <a class="sec keep" href="blog/">文章</a>
      <a class="sec" id="nav-contact" href="#contact" hidden>聯絡</a>
      <button id="open-pal" type="button" aria-label="開啟指令面板">Ctrl K</button>
      <button id="theme" type="button" aria-label="切換深色或淺色">◐</button>
    </nav>

    <main id="main">
      <header class="hero" id="top">
        <canvas id="fx" aria-hidden="true"></canvas>
        <div class="hero-in wrap">
          <div>
            <h1 id="name"></h1>
            <p class="intro" id="intro"></p>
            <p class="motto" id="motto"></p>
            <div class="links" id="links"></div>
          </div>
          <div class="deck">
            <div class="hud" id="hud" aria-live="polite"></div>
            <div class="kb-stage">
              <div class="kb" id="kb" role="group" aria-label="互動鍵盤：按實體鍵盤的字母鍵，或點鍵帽，看每項技能用在哪裡"></div>
            </div>
            <div class="deck-foot">
              <div class="legend" id="legend"></div>
              <button class="sound" id="sound" type="button" aria-pressed="false">音效：關</button>
            </div>
          </div>
        </div>
      </header>

      <section class="section wrap" id="research">
        <h2 class="sh">研究</h2>
        <div class="interests" id="interests"></div>
        <div id="studies"></div>
      </section>

      <section class="section wrap" id="experience">
        <h2 class="sh">經歷</h2>
        <div class="win rise" id="win">
          <div class="tabs" id="tabs" role="tablist" aria-label="經歷檔案"></div>
          <div class="buf" id="buf" tabindex="0" role="tabpanel" aria-label="檔案內容"></div>
          <div class="edbar">
            <span class="mode">NORMAL</span>
            <span class="pos" id="ed-pos"></span>
          </div>
        </div>
      </section>

      <section class="section wrap" id="projects">
        <h2 class="sh">作品</h2>
        <ul class="cards" id="cards"></ul>
        <ul class="more" id="more"></ul>
      </section>

      <section class="section wrap" id="contact" hidden>
        <h2 class="sh">聯絡</h2>
        <form class="panel contact rise" id="contact-form">
          <label>姓名<input name="name" type="text" autocomplete="name" required maxlength="80" /></label>
          <label>Email<input name="email" type="email" autocomplete="email" required maxlength="120" /></label>
          <label class="full">訊息<textarea name="message" required maxlength="4000"></textarea></label>
          <input class="trap" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="row full">
            <button id="contact-send" type="submit">寄出</button>
            <span class="note" id="contact-note" role="status"></span>
            <a class="direct" id="contact-direct" hidden></a>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer wrap">© 2026 翁祺鈞 Chi-Jiun Wong</footer>

    <div class="status" aria-hidden="true">
      <span class="mode" id="st-mode">NORMAL</span>
      <span class="file" id="st-file">about.md</span>
      <span class="msg" id="st-msg"></span>
      <span id="st-pos">0%</span>
    </div>

    <dialog id="pal" aria-label="指令面板">
      <div>
        <input id="q" type="text" placeholder="搜尋，或輸入 : 指令" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="搜尋指令" />
        <ul id="list" role="listbox"></ul>
      </div>
    </dialog>

    <script type="module" src="main.js?v=bce145fc"></script>
  </body>
</html>
