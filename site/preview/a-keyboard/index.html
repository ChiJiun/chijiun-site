<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>範本 A · 互動鍵盤</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f22; --bg2: #141c3f; --surface: #121a33; --line: #24304f;
        --text: #e6eaf5; --muted: #93a0bd; --sky: #7dd3fc; --primary: #5b8cff;
        --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 72px; }
      body { margin: 0; font: 16px/1.7 var(--sans); background: var(--bg); color: var(--text); padding-bottom: 34px; }
      h1, h2, h3, p, ul { margin: 0; }
      a { color: inherit; }
      .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
      kbd { font: 12px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: #0d1430; color: var(--text); }

      .nav { position: fixed; inset: 0 0 auto; z-index: 10; backdrop-filter: blur(10px); background: rgba(10, 15, 34, .7); border-bottom: 1px solid var(--line); }
      .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
      .brand { font-weight: 800; text-decoration: none; }
      .brand span { color: var(--sky); }
      .back { font-size: 14px; color: var(--muted); text-decoration: none; }
      .back:hover { color: var(--sky); }

      .hero { position: relative; overflow: hidden; padding: 128px 0 88px; background: linear-gradient(135deg, var(--bg), var(--bg2)); }
      .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 56px; align-items: center; }
      .kicker { font-size: 14px; font-weight: 600; letter-spacing: .1em; color: var(--sky); }
      .hero h1 { margin-top: 10px; font-size: clamp(42px, 6vw, 68px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
      .hero h1 span { background: linear-gradient(90deg, #fff, var(--sky)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .lead { margin-top: 22px; font-size: 18px; color: rgba(255, 255, 255, .9); }
      .motto { margin-top: 22px; padding-left: 14px; border-left: 3px solid var(--sky); font-size: 15px; color: var(--muted); }
      .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
      .links a { padding: 9px 20px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); text-decoration: none; font-weight: 600; font-size: 15px; transition: background .15s, border-color .15s; }
      .links a:hover { background: rgba(255, 255, 255, .1); border-color: var(--sky); }

      /* ---- deck: readout + keyboard ---- */
      .hud { min-height: 132px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(8, 12, 28, .85); font: 14px/1.6 var(--mono); box-shadow: inset 0 0 40px rgba(125, 211, 252, .05); }
      .hud-top { display: flex; align-items: center; gap: 10px; }
      .hud-key { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 6px; background: var(--c, var(--sky)); color: #0a0f22; font-weight: 700; }
      .hud-name { font-size: 18px; font-weight: 700; color: #fff; }
      .hud-cat { margin-left: auto; font-size: 12px; color: var(--c, var(--muted)); }
      .hud-desc { margin-top: 8px; color: #c5cee6; font-family: var(--sans); font-size: 15px; }
      .hud-link { display: inline-block; margin-top: 6px; color: var(--sky); text-decoration: none; }
      .hud-link:hover { text-decoration: underline; }
      .hud-idle { color: var(--muted); }
      .hud-idle b { color: var(--sky); }
      .caret { display: inline-block; width: 8px; height: 16px; margin-left: 4px; background: var(--sky); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .kb-stage { container-type: inline-size; perspective: 1300px; margin-top: 28px; }
      .kb {
        --gap: 6px;
        --u: min(52px, calc((100cqw - 9 * var(--gap) - 28px) / 10));
        --d: calc(var(--u) * .2);
        --px: 0; --py: 0;
        display: grid; gap: var(--gap); justify-items: center;
        padding: 14px 14px calc(14px + var(--d));
        border-radius: 16px; border: 1px solid #2a3760;
        background: linear-gradient(#131b3b, #0c1229);
        box-shadow: 0 30px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(125, 211, 252, .06);
        transform: rotateX(calc(34deg - var(--py) * 7deg)) rotateY(calc(var(--px) * 9deg)) rotateZ(calc(-2deg + var(--px) * 2deg));
        transform-origin: 50% 60%;
        transition: transform .25s ease-out;
      }
      .kb-row { display: flex; gap: var(--gap); }
      .key { position: relative; width: var(--u); height: var(--u); padding: 0; border: 0; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .key.wide { width: calc(var(--u) * 5 + var(--gap) * 4); }
      .cap {
        position: absolute; inset: 0; display: grid; place-items: center;
        border-radius: calc(var(--u) * .18);
        background: linear-gradient(#2a3564, #1b2347);
        box-shadow: 0 var(--d) 0 #080c1d, 0 calc(var(--d) + 4px) 10px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .14);
        transform: translateY(calc(var(--d) * -1));
        transition: transform .07s ease-out, box-shadow .07s ease-out, background .2s;
      }
      .cap i { position: absolute; top: 3px; left: 6px; font: normal 10px var(--mono); color: #7582a8; text-transform: uppercase; }
      .cap b { font: 700 calc(var(--u) * .27) var(--mono); color: var(--c, #55618a); }
      .key[data-c] .cap::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 5px; height: 2px; border-radius: 2px; background: var(--c); opacity: .7; }
      .key:hover .cap { background: linear-gradient(#34417a, #222c58); }
      .key.down .cap { transform: translateY(-2px); box-shadow: 0 2px 0 #080c1d, 0 0 26px var(--c, rgba(125, 211, 252, .5)), inset 0 1px 0 rgba(255, 255, 255, .14); background: linear-gradient(#3a4a8a, #26326a); }
      .key.active .cap b { text-shadow: 0 0 14px var(--c); }
      .deck-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; font-size: 13px; color: var(--muted); }
      .sound { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; cursor: pointer; }
      .sound:hover { color: var(--sky); border-color: var(--sky); }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
      .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); }

      /* ---- content ---- */
      .section { padding: 80px 0; border-top: 1px solid var(--line); }
      .section h2 { position: relative; display: inline-block; margin-bottom: 36px; padding-bottom: 12px; font-size: 30px; font-weight: 800; }
      .section h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 56px; height: 4px; border-radius: 2px; background: var(--sky); }
      .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .card { display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); transition: transform .2s, border-color .2s; }
      .card:hover { transform: translateY(-4px); border-color: var(--sky); }
      .tag { align-self: flex-start; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(125, 211, 252, .12); color: var(--sky); }
      .card h3 { font-size: 19px; }
      .card .sub { font-size: 14px; color: var(--sky); }
      .card .note { font-size: 14px; color: var(--muted); }
      .card a { margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 14px; color: var(--sky); text-decoration: none; }
      .list { display: grid; gap: 22px; padding: 0; list-style: none; }
      .list h3 { font-size: 19px; }
      .list .sub { color: var(--sky); font-size: 15px; }
      .list ul { margin-top: 8px; padding-left: 20px; color: #c5cee6; }

      .status { position: fixed; inset: auto 0 0; z-index: 10; display: flex; gap: 14px; align-items: center; height: 34px; padding: 0 16px; font: 12.5px var(--mono); background: #070b1a; border-top: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; }
      .status b { padding: 2px 8px; border-radius: 4px; background: var(--sky); color: #0a0f22; }

      @media (max-width: 960px) {
        .hero .wrap { grid-template-columns: 1fr; gap: 40px; }
        .cards { grid-template-columns: 1fr; }
      }
      @media (max-width: 600px) {
        .wrap { padding: 0 16px; }
        .hero { padding: 100px 0 64px; }
        .kb { --gap: 4px; padding: 10px 10px calc(10px + var(--d)); }
        .cap i { display: none; }
        .status span.long { display: none; }
        .deck-foot { flex-direction: column; align-items: flex-start; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .kb, .cap, .card { transition: none; }
        .caret { animation: none; }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="wrap">
        <a class="brand" href="#top">Chi-Jiun<span>.</span></a>
        <a class="back" href="../">← 回範本列表</a>
      </div>
    </nav>

    <header class="hero" id="top">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="wrap">
        <div>
          <p class="kicker" id="kicker"></p>
          <h1>Chi-Jiun <span>Wong</span></h1>
          <p class="lead" id="lead"></p>
          <p class="motto" id="motto"></p>
          <div class="links" id="links"></div>
        </div>
        <div class="deck">
          <div class="hud" id="hud" aria-live="polite"></div>
          <div class="kb-stage">
            <div class="kb" id="kb" role="group" aria-label="互動鍵盤：按實體鍵盤的字母鍵，或點鍵帽，看每項技能用在哪裡"></div>
          </div>
          <div class="deck-foot">
            <div class="legend" id="legend"></div>
            <button class="sound" id="sound" type="button" aria-pressed="false">按鍵音效：關</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="section" id="research"><div class="wrap"><h2>研究</h2><ul class="list" id="research-list"></ul></div></section>
      <section class="section" id="projects"><div class="wrap"><h2>作品</h2><div class="cards" id="cards"></div></div></section>
      <section class="section" id="talks"><div class="wrap"><h2>報告與簡報</h2><ul class="list" id="talk-list"></ul></div></section>
    </main>

    <div class="status" aria-hidden="true">
      <b>A · KEYBOARD</b>
      <span>字母鍵：看技能</span>
      <span class="long">1 研究 · 2 作品 · 3 報告 · 0 回頂端</span>
    </div>

    <script type="module">
      import { me, research, projects, talks, skills, cats, repoUrl } from '../data.js';

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      };
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---------- static content ----------
      $('kicker').textContent = `${me.zh} · ${me.tagline}`;
      $('lead').textContent = me.intro;
      $('motto').textContent = me.motto;
      for (const l of me.links) {
        const a = el('a', '', l.label);
        a.href = l.href; a.target = '_blank'; a.rel = 'noreferrer';
        $('links').append(a);
      }
      {
        const li = el('li');
        li.append(el('h3', '', research.title), el('p', 'sub', research.org));
        const ul = el('ul');
        research.points.forEach((p) => ul.append(el('li', '', p)));
        li.append(ul);
        $('research-list').append(li);
      }
      for (const p of projects) {
        const card = el('article', 'card');
        const a = el('a', '', 'repo →');
        a.href = p.href; a.target = '_blank'; a.rel = 'noreferrer';
        card.append(el('span', 'tag', p.tag), el('h3', '', p.title), el('p', 'sub', p.sub), el('p', '', p.desc), el('p', 'note', p.note), a);
        $('cards').append(card);
      }
      for (const t of talks) {
        const li = el('li');
        li.append(el('h3', '', `${t.title}　${t.date}`), el('p', 'sub', t.sub));
        if (t.items.length) {
          const ul = el('ul');
          t.items.forEach((i) => ul.append(el('li', '', i)));
          li.append(ul);
        }
        $('talk-list').append(li);
      }
      for (const c of Object.values(cats)) {
        const s = el('span', '', c.label);
        s.style.setProperty('--c', c.color);
        $('legend').append(s);
      }

      // ---------- readout ----------
      const hud = $('hud');
      const coarse = matchMedia('(pointer: coarse)').matches;
      function hudIdle() {
        hud.replaceChildren();
        const p = el('p', 'hud-idle');
        p.append('> ', coarse ? '點任何一個鍵帽' : '按鍵盤上任何一個字母鍵，或點鍵帽');
        p.append(el('span', 'caret'));
        const q = el('p', 'hud-idle');
        q.append('每個鍵帽是一項技能，這裡會顯示', el('b', '', '我用它做了什麼'), '。');
        hud.append(p, q);
      }
      function hudSkill(key, s) {
        const c = cats[s.cat];
        hud.replaceChildren();
        hud.style.setProperty('--c', c.color);
        const top = el('div', 'hud-top');
        top.append(el('span', 'hud-key', key.toUpperCase()), el('span', 'hud-name', s.name), el('span', 'hud-cat', c.label));
        hud.append(top, el('p', 'hud-desc', s.desc));
        if (s.repo) {
          const a = el('a', 'hud-link', `→ ${s.repo}`);
          a.href = repoUrl(s.repo); a.target = '_blank'; a.rel = 'noreferrer';
          hud.append(a);
        }
      }
      function hudEmpty(key) {
        hud.replaceChildren();
        hud.style.removeProperty('--c');
        const top = el('div', 'hud-top');
        top.append(el('span', 'hud-key', key.toUpperCase()), el('span', 'hud-name', '這個鍵還空著'));
        hud.append(top, el('p', 'hud-desc', '還在學新東西，學會了再補上。'));
      }
      hudIdle();

      // ---------- keyboard ----------
      const NAV = { 1: ['研', 'research', '研究'], 2: ['作', 'projects', '作品'], 3: ['報', 'talks', '報告與簡報'], 0: ['↑', 'top', '頁首'] };
      const ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
      const kb = $('kb');
      const keys = new Map();
      for (const row of ROWS) {
        const r = el('div', 'kb-row');
        for (const k of row) {
          const b = el('button', 'key');
          b.type = 'button'; b.tabIndex = -1; b.dataset.key = k;
          const cap = el('span', 'cap');
          cap.append(el('i', '', k));
          const s = skills[k];
          if (s) {
            b.dataset.c = s.cat;
            b.style.setProperty('--c', cats[s.cat].color);
            b.setAttribute('aria-label', `${k.toUpperCase()}：${s.name}`);
            cap.append(el('b', '', s.short));
          } else if (NAV[k]) {
            b.style.setProperty('--c', '#ffffff');
            b.setAttribute('aria-label', `${k}：跳到${NAV[k][2]}`);
            cap.append(el('b', '', NAV[k][0]));
          } else {
            b.setAttribute('aria-label', `${k.toUpperCase()}：空白鍵`);
          }
          b.append(cap);
          r.append(b);
          keys.set(k, b);
        }
        kb.append(r);
      }
      {
        const r = el('div', 'kb-row');
        const b = el('button', 'key wide');
        b.type = 'button'; b.tabIndex = -1; b.dataset.key = ' ';
        b.setAttribute('aria-label', '空白鍵');
        const cap = el('span', 'cap');
        cap.append(el('b', '', 'chijiun'));
        b.append(cap);
        r.append(b);
        kb.append(r);
        keys.set(' ', b);
      }

      let soundOn = false;
      let audio;
      function click() {
        if (!soundOn) return;
        audio ??= new AudioContext();
        const t = audio.currentTime;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(170 + Math.random() * 70, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.05);
        gain.gain.setValueAtTime(0.07, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      }
      $('sound').addEventListener('click', (e) => {
        soundOn = !soundOn;
        e.currentTarget.setAttribute('aria-pressed', String(soundOn));
        e.currentTarget.textContent = `按鍵音效：${soundOn ? '開' : '關'}`;
        click();
      });

      let active = null;
      function press(k) {
        const b = keys.get(k);
        if (!b || b.classList.contains('down')) return;
        b.classList.add('down');
        click();
        const rect = b.getBoundingClientRect();
        field.ripple(rect.left + rect.width / 2, rect.top + rect.height / 2);
        if (skills[k]) {
          active?.classList.remove('active');
          active = b;
          b.classList.add('active');
          hudSkill(k, skills[k]);
        } else if (NAV[k]) {
          document.getElementById(NAV[k][1]).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
        } else if (k !== ' ') {
          hudEmpty(k);
        }
      }
      const release = (k) => keys.get(k)?.classList.remove('down');
      const releaseAll = () => keys.forEach((b) => b.classList.remove('down'));

      kb.addEventListener('pointerdown', (e) => {
        const b = e.target.closest('.key');
        if (b) press(b.dataset.key);
      });
      for (const type of ['pointerup', 'pointerleave', 'pointercancel']) kb.addEventListener(type, releaseAll);
      addEventListener('blur', releaseAll);
      addEventListener('keydown', (e) => {
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target.closest?.('input, textarea, [contenteditable]')) return;
        const k = e.key.toLowerCase();
        if (k !== ' ' && keys.has(k)) press(k);
      });
      addEventListener('keyup', (e) => release(e.key.toLowerCase()));

      // ---------- pointer field ----------
      const hero = document.querySelector('.hero');
      const field = (() => {
        const canvas = $('field');
        const ctx = canvas.getContext('2d');
        const GAP = 30, R = 130, LIFE = 1400;
        let w = 0, h = 0, pts = [], ripples = [], raf = 0;
        const mouse = { x: -9999, y: -9999 };

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          w = hero.clientWidth; h = hero.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          pts = [];
          for (let y = GAP / 2; y < h; y += GAP) for (let x = GAP / 2; x < w; x += GAP) pts.push({ ox: x, oy: y, x, y, vx: 0, vy: 0 });
          draw();
        }
        function draw() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#7dd3fc';
          for (const p of pts) {
            const disp = Math.hypot(p.x - p.ox, p.y - p.oy);
            ctx.globalAlpha = Math.min(1, 0.16 + disp / 12);
            const size = 1.3 + Math.min(2.4, disp / 5);
            ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
          }
          ctx.globalAlpha = 1;
        }
        function step() {
          const now = performance.now();
          ripples = ripples.filter((r) => now - r.t < LIFE);
          let energy = 0;
          for (const p of pts) {
            let fx = (p.ox - p.x) * 0.06, fy = (p.oy - p.y) * 0.06;
            const mx = p.x - mouse.x, my = p.y - mouse.y, md = Math.hypot(mx, my) || 1;
            if (md < R) { const f = (1 - md / R) * 2.4; fx += (mx / md) * f; fy += (my / md) * f; }
            for (const r of ripples) {
              const age = (now - r.t) / LIFE, rx = p.ox - r.x, ry = p.oy - r.y, rd = Math.hypot(rx, ry) || 1;
              const diff = Math.abs(rd - age * 560);
              if (diff < 44) { const f = (1 - diff / 44) * (1 - age) * 1.8; fx += (rx / rd) * f; fy += (ry / rd) * f; }
            }
            p.vx = (p.vx + fx) * 0.82; p.vy = (p.vy + fy) * 0.82;
            p.x += p.vx; p.y += p.vy;
            energy += Math.abs(p.vx) + Math.abs(p.vy);
          }
          draw();
          raf = energy > 0.6 || ripples.length ? requestAnimationFrame(step) : 0;
        }
        const wake = () => { if (!raf && !reduced) raf = requestAnimationFrame(step); };

        hero.addEventListener('pointermove', (e) => {
          const rect = hero.getBoundingClientRect();
          mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
          kb.style.setProperty('--px', ((e.clientX / innerWidth) * 2 - 1).toFixed(3));
          kb.style.setProperty('--py', (((e.clientY - rect.top) / rect.height) * 2 - 1).toFixed(3));
          wake();
        });
        hero.addEventListener('pointerleave', () => {
          mouse.x = mouse.y = -9999;
          kb.style.setProperty('--px', 0); kb.style.setProperty('--py', 0);
          wake();
        });
        new ResizeObserver(resize).observe(hero);

        return {
          ripple(clientX, clientY) {
            const rect = hero.getBoundingClientRect();
            ripples.push({ x: clientX - rect.left, y: clientY - rect.top, t: performance.now() });
            wake();
          },
        };
      })();
    </script>
  </body>
</html>
