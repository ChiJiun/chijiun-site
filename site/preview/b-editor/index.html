<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>範本 B · 編輯器風格</title>
    <style>
      :root {
        --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Noto Sans TC", "Microsoft JhengHei", monospace;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --page: #0f1017; --bg: #1a1b26; --bg2: #16161e; --line: #292e42; --sel: #283457;
        --fg: #c0caf5; --dim: #565f89; --blue: #7aa2f7; --green: #9ece6a; --purple: #bb9af7;
        --orange: #ff9e64; --yellow: #e0af68; --red: #f7768e; --cyan: #7dcfff;
      }
      [data-theme="light"] {
        color-scheme: light;
        --page: #cfd3de; --bg: #e9eaf0; --bg2: #dcdee7; --line: #c4c8da; --sel: #c9d3f2;
        --fg: #343b58; --dim: #8990b3; --blue: #2e5cd9; --green: #4c7a1e; --purple: #7847bd;
        --orange: #b15c00; --yellow: #8f5e15; --red: #c1263f; --cyan: #0f6e8c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--fg); font: 15px/1.75 var(--mono); }
      button { font: inherit; color: inherit; }
      .win { display: grid; grid-template-rows: auto 1fr auto auto; width: min(1180px, 100%); height: min(820px, 100%); border: 1px solid var(--line); border-radius: 12px; background: var(--bg); overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }

      .titlebar { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 40px; background: var(--bg2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); }
      .dots { display: flex; gap: 7px; }
      .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
      .dots i:nth-child(2) { background: var(--yellow); }
      .dots i:nth-child(3) { background: var(--green); }
      .titlebar .name { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .titlebar a { color: var(--dim); text-decoration: none; white-space: nowrap; }
      .titlebar a:hover { color: var(--blue); }

      .body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
      .tree { padding: 12px 8px; background: var(--bg2); border-right: 1px solid var(--line); overflow: auto; font-size: 14px; }
      .tree p { margin: 0 0 6px; padding: 0 8px; color: var(--dim); font-size: 12px; letter-spacing: .1em; }
      .tree button { display: flex; gap: 8px; width: 100%; padding: 3px 8px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
      .tree button:hover { background: var(--line); }
      .tree button[aria-current="true"] { background: var(--sel); color: var(--blue); }
      .tree .n { color: var(--dim); }

      .pane { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
      .tabs { display: flex; overflow-x: auto; background: var(--bg2); border-bottom: 1px solid var(--line); scrollbar-width: none; font-size: 13.5px; }
      .tabs button { flex-shrink: 0; padding: 7px 14px; border: 0; border-right: 1px solid var(--line); background: none; color: var(--dim); cursor: pointer; white-space: nowrap; }
      .tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 2px 0 var(--blue); }

      .buf { overflow: auto; padding: 10px 0 40px; outline: none; scroll-padding: 60px 0; }
      .ln { display: grid; grid-template-columns: 52px minmax(0, 1fr); padding-right: 20px; cursor: text; }
      .ln .no { padding-right: 14px; text-align: right; color: var(--dim); user-select: none; }
      .ln .tx { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.75em; }
      .ln.cur { background: var(--sel); }
      .ln.cur .no { color: var(--yellow); }
      .h1 { color: var(--blue); font-weight: 700; }
      .h2 { color: var(--purple); font-weight: 700; }
      .sym { color: var(--dim); }
      .quote { color: var(--green); font-style: italic; }
      .meta { color: var(--orange); }
      .note { color: var(--dim); }
      .tx a { color: var(--cyan); text-underline-offset: 4px; }
      .k { color: var(--blue); }
      .s { color: var(--green); }
      .key { padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg2); color: var(--yellow); }

      .cmd { display: flex; align-items: center; gap: 4px; padding: 4px 14px; border-top: 1px solid var(--line); min-height: 34px; font-size: 14px; }
      .cmd input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; }
      .cmd .msg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cmd .msg.err { color: var(--red); }
      .cmd [hidden] { display: none; }

      .status { display: flex; align-items: center; gap: 0; height: 30px; background: var(--bg2); border-top: 1px solid var(--line); font-size: 13px; white-space: nowrap; overflow: hidden; }
      .status .mode { padding: 0 12px; height: 100%; display: grid; place-items: center; background: var(--blue); color: var(--bg); font-weight: 700; }
      .status .mode.command { background: var(--orange); }
      .status span { padding: 0 12px; }
      .status .hint { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
      .status .pos { color: var(--dim); }
      .colon { display: none; }

      @media (max-width: 760px) {
        body { padding: 0; }
        .win { height: 100%; border-radius: 0; border: 0; }
        .body { grid-template-columns: 1fr; }
        .tree { display: none; }
        .ln { grid-template-columns: 38px minmax(0, 1fr); padding-right: 12px; }
        .status .hint { display: none; }
        .status .file { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .colon { display: grid; place-items: center; position: fixed; right: 16px; bottom: 84px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--blue); color: var(--bg); font-weight: 700; font-size: 22px; cursor: pointer; }
      }
    </style>
  </head>
  <body>
    <div class="win">
      <div class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="name" id="title">chijiun — ~/site</span>
        <a href="../">← 回範本列表</a>
      </div>
      <div class="body">
        <nav class="tree" id="tree" aria-label="檔案"><p>~/SITE</p></nav>
        <div class="pane">
          <div class="tabs" id="tabs" role="tablist"></div>
          <main class="buf" id="buf" tabindex="0" aria-label="檔案內容"></main>
        </div>
      </div>
      <div class="cmd">
        <span id="colon" hidden>:</span>
        <input id="cmd" hidden autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="指令" />
        <span class="msg" id="msg" role="status">按 ? 看快捷鍵，或按 : 輸入指令</span>
      </div>
      <div class="status">
        <span class="mode" id="mode">NORMAL</span>
        <span class="file" id="file"></span>
        <span class="hint" id="hint"></span>
        <span class="pos" id="pos"></span>
      </div>
    </div>
    <button class="colon" id="colon-btn" type="button" aria-label="輸入指令">:</button>

    <script type="module">
      import { me, education, research, projects, talks, skills, cats } from '../data.js';

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      };

      // ---------- buffers: each line is { c: class, pre: prefix symbol, text, href } ----------
      const L = (c, text, extra = {}) => ({ c, text, ...extra });
      const blank = () => L('', '');
      const link = (label, href) => L('link', label, { href });

      const about = [
        L('h1', `${me.zh} ${me.en}`, { pre: '# ' }), blank(),
        L('quote', me.motto, { pre: '> ' }), blank(),
        L('', me.intro), blank(),
        L('', me.rule), blank(),
        L('h2', '連結', { pre: '## ' }),
        ...me.links.map((l) => link(l.label, l.href)), blank(),
        L('h2', '怎麼逛這個網站', { pre: '## ' }),
        L('', 'j / k 或方向鍵：上下移動', { pre: '- ' }),
        L('', '1 – 7、h / l：切換檔案', { pre: '- ' }),
        L('', 'Enter：開啟游標所在行的連結', { pre: '- ' }),
        L('', ':：輸入指令，例如 :theme、:e projects', { pre: '- ' }),
        L('', '用滑鼠點也可以', { pre: '- ' }),
      ];

      const edu = [
        L('h1', '學歷', { pre: '# ' }), blank(),
        ...education.flatMap((e) => [L('h2', e.title, { pre: '## ' }), L('meta', `${e.org} · ${e.date}`), blank()]),
      ];

      const res = [
        L('h1', '研究', { pre: '# ' }), blank(),
        L('h2', research.title, { pre: '## ' }),
        L('meta', research.org), blank(),
        ...research.points.map((p) => L('', p, { pre: '- ' })), blank(),
        link(research.link.label, research.link.href),
      ];

      const proj = [
        L('h1', '作品', { pre: '# ' }), blank(),
        ...projects.flatMap((p) => [
          L('h2', p.title, { pre: '## ' }),
          L('meta', [p.tag, p.year, p.sub].filter(Boolean).join(' · ')),
          L('', p.desc),
          L('note', p.note),
          L('note', `stack: ${p.stack.join(', ')}`),
          link(p.repo, p.href),
          blank(),
        ]),
      ];

      const talk = [
        L('h1', '報告與簡報', { pre: '# ' }), blank(),
        ...talks.flatMap((t) => [
          L('h2', t.title, { pre: '## ' }),
          L('meta', `${t.date} · ${t.sub}`),
          ...t.items.map((i) => L('', i, { pre: '- ' })),
          blank(),
        ]),
      ];

      const skillJson = (() => {
        const lines = [L('sym', '{')];
        const groups = Object.entries(cats);
        groups.forEach(([id, cat], gi) => {
          lines.push({ json: [['sym', '  '], ['k', `"${cat.label}"`], ['sym', ': [']] });
          const names = Object.values(skills).filter((s) => s.cat === id).map((s) => s.name);
          names.forEach((n, i) => lines.push({ json: [['sym', '    '], ['s', `"${n}"`], ['sym', i < names.length - 1 ? ',' : '']] }));
          lines.push(L('sym', gi < groups.length - 1 ? '  ],' : '  ]'));
        });
        lines.push(L('sym', '}'));
        return lines;
      })();

      const help = [
        L('h1', '快捷鍵', { pre: '# ' }), blank(),
        L('h2', '移動', { pre: '## ' }),
        L('', 'j / ↓　下一行', { pre: '- ' }),
        L('', 'k / ↑　上一行', { pre: '- ' }),
        L('', 'g g　　跳到第一行', { pre: '- ' }),
        L('', 'G　　　跳到最後一行', { pre: '- ' }), blank(),
        L('h2', '檔案', { pre: '## ' }),
        L('', '1 – 7　直接開第幾個檔案', { pre: '- ' }),
        L('', 'h / l　上一個、下一個檔案', { pre: '- ' }),
        L('', 'Enter　開啟游標所在行的連結', { pre: '- ' }), blank(),
        L('h2', '指令（先按 :）', { pre: '## ' }),
        L('', ':e <檔名>　開檔，例如 :e projects', { pre: '- ' }),
        L('', ':<行號>　　跳到那一行，例如 :12', { pre: '- ' }),
        L('', ':theme　　切換深色、淺色', { pre: '- ' }),
        L('', ':ls　　　　列出所有檔案', { pre: '- ' }),
        L('', ':q　　　　試試看', { pre: '- ' }),
      ];

      const files = [
        { name: 'about.md', lines: about },
        { name: 'education.md', lines: edu },
        { name: 'research.md', lines: res },
        { name: 'projects.md', lines: proj },
        { name: 'talks.md', lines: talk },
        { name: 'skills.json', lines: skillJson },
        { name: 'help.txt', lines: help },
      ];

      // ---------- state + render ----------
      const cursors = files.map(() => 0);
      let cur = 0;
      const buf = $('buf'), tree = $('tree'), tabs = $('tabs');

      files.forEach((f, i) => {
        const t = el('button');
        t.type = 'button';
        t.append(el('span', 'n', String(i + 1)), f.name);
        t.addEventListener('click', () => open(i));
        tree.append(t);
        const tab = el('button', '', f.name);
        tab.type = 'button'; tab.setAttribute('role', 'tab');
        tab.addEventListener('click', () => open(i));
        tabs.append(tab);
      });

      function renderLine(line, i) {
        const row = el('div', 'ln');
        row.dataset.i = i;
        const tx = el('span', 'tx');
        if (line.json) {
          line.json.forEach(([c, t]) => tx.append(el('span', c, t)));
        } else if (line.href) {
          tx.append(el('span', 'sym', '→ '));
          const a = el('a', '', line.text);
          a.href = line.href; a.target = '_blank'; a.rel = 'noreferrer';
          tx.append(a);
        } else {
          if (line.pre) tx.append(el('span', 'sym', line.pre));
          tx.append(el('span', line.c, line.text));
        }
        row.append(el('span', 'no', String(i + 1)), tx);
        return row;
      }

      function open(i) {
        cur = (i + files.length) % files.length;
        buf.replaceChildren(...files[cur].lines.map(renderLine));
        [...tree.querySelectorAll('button')].forEach((b, n) => b.setAttribute('aria-current', String(n === cur)));
        [...tabs.children].forEach((b, n) => {
          b.setAttribute('aria-selected', String(n === cur));
          if (n === cur) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        });
        $('title').textContent = `chijiun — ~/site/${files[cur].name}`;
        move(cursors[cur], true);
      }

      function move(line, instant) {
        const lines = files[cur].lines;
        const next = Math.max(0, Math.min(lines.length - 1, line));
        buf.querySelector('.cur')?.classList.remove('cur');
        cursors[cur] = next;
        const row = buf.children[next];
        row.classList.add('cur');
        if (instant && next === 0) buf.scrollTop = 0;
        else row.scrollIntoView({ block: 'nearest' });
        $('file').textContent = files[cur].name;
        $('pos').textContent = `${next + 1}:${lines.length}`;
        $('hint').textContent = lines[next].href ? `Enter 開啟 ${lines[next].href}` : 'j/k 移動 · 1-7 檔案 · : 指令 · ? 說明';
      }

      const say = (text, err) => {
        const m = $('msg');
        m.textContent = text;
        m.classList.toggle('err', Boolean(err));
      };
      const openLink = () => {
        const line = files[cur].lines[cursors[cur]];
        if (line.href) window.open(line.href, '_blank', 'noopener');
        else say('這一行沒有連結', true);
      };
      const toggleTheme = () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        say(`colorscheme: ${root.dataset.theme}`);
      };

      // ---------- command line ----------
      const cmd = $('cmd');
      function cmdOpen() {
        $('colon').hidden = false; cmd.hidden = false; $('msg').hidden = true;
        $('mode').textContent = 'COMMAND'; $('mode').classList.add('command');
        cmd.value = ''; cmd.focus();
      }
      function cmdClose() {
        $('colon').hidden = true; cmd.hidden = true; $('msg').hidden = false;
        $('mode').textContent = 'NORMAL'; $('mode').classList.remove('command');
        buf.focus({ preventScroll: true });
      }
      function run(raw) {
        const input = raw.trim();
        if (!input) return;
        const [name, ...rest] = input.split(/\s+/);
        const arg = rest.join(' ');
        if (/^\d+$/.test(name)) return move(Number(name) - 1);
        if (name === 'e' || name === 'edit') {
          const i = files.findIndex((f) => f.name === arg || f.name.split('.')[0] === arg);
          return i < 0 ? say(`找不到檔案：${arg || '（沒給檔名）'}`, true) : open(i);
        }
        if (name === 'help' || name === 'h') return open(files.length - 1);
        if (name === 'theme' || name === 'colorscheme') return toggleTheme();
        if (name === 'ls' || name === 'files') return say(files.map((f, i) => `${i + 1}:${f.name}`).join('  '));
        if (name === 'open') return openLink();
        if (['q', 'q!', 'wq', 'x'].includes(name)) return say('這裡跟 vim 一樣，出不去的。按 ? 看看還能做什麼。');
        say(`不認得的指令：${name}（:help 可以看全部）`, true);
      }
      cmd.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { const v = cmd.value; cmdClose(); run(v); }
        else if (e.key === 'Escape') cmdClose();
        else if (e.key === 'Tab') {
          e.preventDefault();
          const m = cmd.value.match(/^(e|edit)\s+(\S*)$/);
          const hit = m && files.find((f) => f.name.startsWith(m[2]));
          if (hit) cmd.value = `${m[1]} ${hit.name}`;
        }
      });
      cmd.addEventListener('blur', () => { if (!cmd.hidden) cmdClose(); });
      $('colon-btn').addEventListener('click', cmdOpen);

      // ---------- normal-mode keys ----------
      let pendingG = 0;
      addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key;
        const now = performance.now();
        const handled = () => e.preventDefault();
        if (k === 'j' || k === 'ArrowDown') { move(cursors[cur] + 1); handled(); }
        else if (k === 'k' || k === 'ArrowUp') { move(cursors[cur] - 1); handled(); }
        else if (k === 'G') { move(Infinity); handled(); }
        else if (k === 'g') { if (now - pendingG < 600) { move(0); pendingG = 0; } else pendingG = now; handled(); }
        else if (k === 'h' || k === 'ArrowLeft') { open(cur - 1); handled(); }
        else if (k === 'l' || k === 'ArrowRight') { open(cur + 1); handled(); }
        else if (/^[1-7]$/.test(k)) { open(Number(k) - 1); handled(); }
        else if (k === 'Enter' || k === 'o') { openLink(); handled(); }
        else if (k === ':') { cmdOpen(); handled(); }
        else if (k === '?') { open(files.length - 1); handled(); }
      });
      buf.addEventListener('click', (e) => {
        const row = e.target.closest('.ln');
        if (row) move(Number(row.dataset.i));
      });

      open(0);
      buf.focus({ preventScroll: true });
    </script>
  </body>
</html>
